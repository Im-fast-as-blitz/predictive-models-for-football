model:
  hidden_size: 512
  dropout: 0.1
  embedder:
    t: 1
    mode: stats
    cat_emb_dim: 8
  layer:
    attention:
      n_heads: 8
    ffn:
      d_ff: 2048
  L: 8
  pooler: one_token
  out_features: 3
dataset:
  name: selected_leagues_one_line
  none_fill: zero
  data:
    target_column: match_result
    season_column: season
    val_season: 2024-2025
    depth: 1
    t: 1
    cat_columns:
      - league_code
    igonre_columns:
      - ftg
      - enemy_ftg
      - s
      - st
      - f
      - c
      - y
      - r
      - enemy_s
      - enemy_st
      - enemy_f
      - enemy_c
      - enemy_y
      - enemy_r
      - ht_w
      - ht_d
      - ht_l
      - date
      - season
      - referee
      - team
      - enemy_team
train:
  kfold_steps: 10
  batch_size: 32
  n_epochs: 10
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
  weight_decay: 1e-4
scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 1.0
  end_factor: 0.01
  total_iters: ${train.n_epochs}
criterion:
  _target_: torch.nn.CrossEntropyLoss
